<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#primary)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
    
    <circle cx="0" cy="-45" r="4" fill="#0EA5E9" />
    <circle cx="39" cy="22.5" r="4" fill="#2563EB" />
    <circle cx="-39" cy="22.5" r="4" fill="#38BDF8" />

    <path d="M0 -25 L21.6 12.5 L-21.6 12.5 Z" fill="none" stroke="url(#secondary)" stroke-width="4" stroke-linejoin="round" />
    
    <path d="M0 -45 L0 -25" stroke="url(#secondary)" stroke-width="3" opacity="0.6"/>
    <path d="M39 22.5 L21.6 12.5" stroke="url(#secondary)" stroke-width="3" opacity="0.6"/>
    <path d="M-39 22.5 L-21.6 12.5" stroke="url(#secondary)" stroke-width="3" opacity="0.6"/>

    <circle cx="0" cy="0" r="12" fill="url(#primary)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>
</svg>
